[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observe-perceive"
version = "1.3.0"
description = "The governed action gate: admission, screen, policy gates, Conservation Kernel approval, execution, observation, record, with a verifiable hash chain over all of it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# The orchestrator calls the Conservation Kernel unconditionally (Phase 3),
# so it is a hard dependency, declared here rather than found as a sibling.
dependencies = [
  # 0.2.0 (root admission, snapshot restore) is required by the boundary
  # this package now holds. 0.3.0 (signed snapshots, PR #5) pinned to the
  # immutable commit it merged as; a tag cannot be pushed from this session.
  # 7b08c79 is Conservation_Kernel main after PR #20 (a kernel needs a root guard
  # or an explicit allow_unguarded_roots). PR #56 pinned that PR's branch head,
  # which squash-merging left off main; this is the commit that is.
  "conservation-kernel @ git+https://github.com/wking53214/conservation_kernel@7b08c79db1b36c97c0de312165f8002b19baf6ae",
]

[project.optional-dependencies]
# The other chain stages. Each adapter resolves a sibling checkout first and
# the installed package second, and its tests skip when neither is present;
# installing this extra makes the whole suite run from a single clone.
# Pinned to commits, like the kernel: unpinned, each install took whatever the
# default branch was that day. GEMS bb4cf40 (2026-09-20) deleted
# HumanAuthorityGuard, HandoffValidator and governance/constitution.py, which
# gems_governance_adapter.py imports, and every fresh install then errored 16
# tests. The adapter now uses GEMS' GovernanceValidator instead, which first
# appears in GEMS f70da70 (the HUMAN-origin allowlist fix, GEMS PR #13). Pinned
# to that commit, which is now GEMS main (PR #13 merged). The other pins are
# the default-branch commits the full suite passed against on 2026-09-24. Bump
# deliberately, and re-run the suite on the new SHA.
chain = [
  "cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC@4aa182659dee69efaaab7376c7eba3378eb670e2",
  # CCCb: the text matcher current CCC requires before it records a finding.
  "cccb @ git+https://github.com/wking53214/CCCb@23911917e25f48522da7318b2e250d119536591f",
  "augur @ git+https://github.com/wking53214/AUGUR@1fc76118f75024be5ebebed227c2d9a4530c78b7",
  "gems-infrastructure @ git+https://github.com/wking53214/GEMS@f70da70",
  "governance-gateway @ git+https://github.com/wking53214/Governance_Gateway@c507be7279c4488f98404514fcea2c900c53168e",
]
# Opt-in strict stage; numpy comes in through its own metadata.
fortress = ["fortress-kernel @ git+https://github.com/wking53214/fortress-kernel@4105ccb5fec2806f3f1ab5aeb0f88151e6a6fdc0"]
# Optional: lets cns_governed_decision combine gates from any library under the
# cns.gate contract. Nothing imports CNS unless that module's pipeline is used.
# Pinned to the tag v2.2.0 (ce6bd05), the first CNS release with DecisionGuard. v1.9.0 predates
# DecisionGuard and the issuance proof on Decision, which root_admission needs;
# there is no tag at or after that commit, and a tag cannot be pushed from this
# session. Not a runtime dependency: a kernel built with a root guard needs it,
# and one built with allow_unguarded_roots=True does not.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v2.2.0"]
test = ["pytest>=8", "hypothesis", "freezegun"]

[tool.setuptools]
# Flat layout: every module sits at the repository root.
py-modules = [
  "adversarial_sensor_faults", "augur_screen_adapter", "capacity_planning",
  "clinical_governance_system", "cns_connector", "cns_governed_decision", "compliance_exporters",
  "conservation_gsa815_adapter", "demo_why", "deterioration_simulator",
  "execution_guard",
  "fda_510k_checklist", "fortress_perceive_adapter", "gateway_admission_adapter",
  "gems_governance_adapter", "governance_chain", "governance_contracts",
  "governance_orchestrator", "governance_record", "governance_recurring_report", "gsa815_observe_adapter", "herald_governance_adapter",
  "approval_governance_adapter", "kalman_trajectory", "observe_consolidated",
  "orchestrator_ccc_adapter", "perceive_conservation_adapter",
  "perceive_consolidated", "reserve_control", "root_admission", "sentinel_perceive_adapter",
  "tie_governance_adapter", "vertical_slice",
]
