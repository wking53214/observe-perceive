# Pytest configuration for the consolidated 7-file clinical governance system.
#
# Collection is scoped to the consolidated test files only. The legacy/ directory
# holds the pre-consolidation modular implementation (archived for reference) and
# is intentionally excluded from test runs.

[pytest]
norecursedirs = legacy .git __pycache__ *.egg-info

python_files = test_observe_consolidated.py test_perceive_consolidated.py test_integration_consolidated.py test_clinical_governance_system.py test_compliance_exporters.py test_capacity_planning.py test_kalman_trajectory.py test_reserve_control.py test_deterioration_simulator.py test_adversarial_sensor_faults.py test_context_sanitization.py

addopts = -q
