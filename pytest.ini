# Pytest configuration for the consolidated 7-file clinical governance system.
#
# Collection is scoped to the consolidated test files only. The legacy/ directory
# holds the pre-consolidation modular implementation (archived for reference) and
# is intentionally excluded from test runs.

[pytest]
norecursedirs = legacy .git __pycache__ *.egg-info

python_files = test_*.py

addopts = -q
pythonpath = .:..
env =
    PYTHONPATH=.:../sentinel_os:../GSA-815
