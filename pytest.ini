# Pytest configuration for the consolidated 7-file clinical governance system.
#
# Collection is scoped to the consolidated test files only. The legacy/ directory
# holds the pre-consolidation modular implementation (archived for reference) and
# is intentionally excluded from test runs.

[pytest]
norecursedirs = legacy .git __pycache__ *.egg-info

python_files = test_*.py

addopts = -q
pythonpath = .:..
# An `env =` block used to sit here putting ../sentinel_os and ../GSA-815 on
# PYTHONPATH. It needs the pytest-env plugin, which neither CI nor a fresh
# clone installs, so pytest ignored it ("Unknown config option: env") and the
# suite has never depended on either path: sentinel_os is never imported and
# GSA-815 is a callable the caller supplies. Removed rather than made to work.
