name: tests

# One checkout, no siblings. Every cross-repo dependency is declared in
# pyproject.toml and installed from there; the adapters resolve installed
# packages when no sibling checkout exists. The earlier version of this
# workflow checked out six sibling repositories beside this one, which
# proved the integration and hid the fact that nothing declared it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.22
          python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Lint (hard gate)
        run: ruff check .
